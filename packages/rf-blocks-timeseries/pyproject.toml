[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-blocks-timeseries"
version = "0.1.0"
description = "ResearchFlow 时间序列回归积木包（经 entry points 注册）"
requires-python = ">=3.10"
dependencies = ["researchflow>=0.1.0", "pandas>=2.0", "numpy>=1.26", "matplotlib>=3.8"]

[project.entry-points."researchflow.blocks"]
timeseries = "rf_blocks_timeseries:BLOCKS_DIR"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rf_blocks_timeseries = ["blocks/*/block.yaml", "blocks/*/*.py"]
