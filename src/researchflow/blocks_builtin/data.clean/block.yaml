id: data.clean
version: 0.1.0
schema_version: 1
category: transform
title: 数据清洗
description: >-
  配置化的去重与缺失值处理（drop_rows / fill_mean / fill_zero）。
  fill_mean 属拟合型统计：请提供 train_indices 使统计量仅来自训练集，
  否则会对含测试集的全量数据取均值（统计泄漏），积木会明确警告。
kind: python
entry: impl:clean

inputs:
  dataset:
    type: table
    description: 输入数据表
  train_indices:
    type: indices
    required: false
    description: 训练集索引；提供时 fill_mean 的均值仅用训练集计算（防统计泄漏）

outputs:
  table:
    type: table
    description: 清洗后的数据表

params:
  type: object
  properties:
    drop_duplicates: {type: boolean, default: false}
    na_strategy:
      type: string
      default: none
      enum: [none, drop_rows, fill_mean, fill_zero]
      description: 缺失值处理策略
    subset:
      type: array
      description: 仅对这些列应用缺失值策略（默认全部列）

validation:
  - file_exists

execution:
  deterministic: true
  requires_approval: false
  timeout_seconds: 300
