[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchflow"
version = "0.1.0"
description = "Composable, verifiable, traceable research experiment trees (agent-platform-neutral core)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.scripts]
rf = "researchflow.cli:main"
researchflow-mcp = "researchflow.mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
researchflow = [
    "registry/schema.sql",
    "templates/*",
    "blocks_builtin/*/block.yaml",
    "blocks_builtin/*/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 端到端 demo 测试（子进程跑完整 CLI）"]
