name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install core (editable) with dev deps
        run: python -m pip install -e ".[dev,mcp]"

      - name: Install timeseries block pack (editable)
        run: python -m pip install -e packages/rf-blocks-timeseries

      - name: Run test suite
        run: python -m pytest -q
